name: Check

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ github.token }}
          version: 2.5.2
          args: --config-path stylua.toml --check lib tests

  lint-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - run: lute setup

      - name: Lint
        run: >
          luau-lsp analyze
          --platform standard
          --base-luaurc .luaurc
          --ignore **/.lute/**
          lib tests

  automated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - name: Run tests
        run: lute test
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}

name: Release
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  publish_pesde:
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      pull-requests: write
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - name: Sync version
        run: lute run scripts/bump_version

      - uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
        with:
          token: ${{ github.token }}

      - run: pesde auth login --token ${{ secrets.PESDE_AUTH }}
        env:
          PESDE_AUTH: ${{ secrets.PESDE_AUTH }}

      - run: pesde publish -y
